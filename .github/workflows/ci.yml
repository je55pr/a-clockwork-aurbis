name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: .NET / Godot C# build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Verify redistributable source only
        shell: pwsh
        run: |
          $blocked = git ls-files | Where-Object {
            $_ -match '(^|/)(\.research|\.godot|bin|obj|node_modules)/' -or
            $_ -match '\.(dll|exe|pdb|dat|mnf|gr2|dds|hkx|bk2|pfx|pem|key)$'
          }
          if ($blocked) { $blocked; throw "Proprietary/generated/binary files must not be committed" }
      - name: Build Godot C# project
        run: dotnet build EsoTest.csproj --configuration Debug --nologo
      - name: Set up Node for profile checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test source-backed NPC profiles
        run: node --test tools/ProfileBuilder/profile.test.js
      - name: Build geometry helper
        run: dotnet build tools/ModelGeometry/ModelGeometry.csproj --configuration Debug --nologo
      - name: Build model indexer
        run: dotnet build tools/ModelNameIndexer/ModelNameIndexer.csproj --configuration Debug --nologo
      - name: Verify indexer help without game data
        run: dotnet run --no-build --project tools/ModelNameIndexer/ModelNameIndexer.csproj -- --help

  simulation:
    name: Independent headless simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up standalone .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build engine without Godot
        run: dotnet build src/AClockworkAurbis.Simulation/AClockworkAurbis.Simulation.csproj --configuration Release --nologo
      - name: Run simulation invariants and deterministic tests
        run: dotnet run --project tests/SimulationTests/SimulationTests.csproj --configuration Release
      - name: Exercise 10000 agents across three days
        run: dotnet run --project tools/SimulationRunner/SimulationRunner.csproj --configuration Release -- --people 10000 --days 3 --json
      - name: Test independently simulated businesses, stock, wages and named places
        run: dotnet run --project tests/SettlementTests/SettlementTests.csproj --configuration Release
      - name: Build source-backed settlement runner without game assets
        run: dotnet build tools/SettlementRunner/SettlementRunner.csproj --configuration Release --nologo
      - name: Set up Node for offline source adapter fixture
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test source catalog extraction without ESO database
        run: node --test tools/SettlementCatalog/export.test.js
